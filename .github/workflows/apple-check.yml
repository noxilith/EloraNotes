name: Check Apple key

# Takes seconds and needs no Mac: asks Apple whether the four secrets for TestFlight work, and says
# what is wrong when they do not. Run it from the Actions tab after changing a secret.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Use just the Key ID
        # The Key ID is the 10 characters after "AuthKey_" in the file's name; a pasted file name works too.
        run: |
          id="${ASC_KEY_ID#AuthKey_}"; id="${id%.p8}"
          echo "ASC_KEY_ID=$id" >> "$GITHUB_ENV"
      - name: Ask Apple
        run: python3 ios/scripts/check-asc-key.py
