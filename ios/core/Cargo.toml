[package]
name = "elora-mobile-core"
version = "0.1.0"
edition = "2021"
description = "The part of EloraNotes the iPhone app shares with the desktop app: notes on disk, and the shared library."
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "elora_mobile_core"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The tool that writes the Swift side of the interface; not part of the app.
bindgen = ["uniffi/cli"]

# Its own workspace: the desktop app's Cargo.lock stays as it is, and this crate is only built
# for the phone (and by its own tests).
[workspace]

[dependencies]
# No window and none of what lets AI apps use the notes: the phone app has neither. It can share a
# note by link, like the desktop app.
elora-notes = { path = "../..", default-features = false, features = ["icons", "share"] }
uniffi = "0.29"
chrono = "0.4"

# netdev 0.46.3 (under iroh) does not compile for iOS with the current libc: see vendor/netdev.
[patch.crates-io]
netdev = { path = "vendor/netdev" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
