[package]
name = "elora-notes"
version = "0.14.0"
edition = "2021"
description = "EloraNotes — A calm, minimalistic cross-platform Markdown notes desktop app"
authors = ["EloraNotes"]
license = "GPL-3.0-or-later"

[lib]
name = "elora_notes"
path = "src/lib.rs"

[[bin]]
name = "elora"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "elora-server"
path = "src/bin/elora-server.rs"

[features]
default = ["gui"]
# Everything that draws a window. `cargo build --no-default-features --bin elora-server`
# produces a server binary with no X11/GL/wayland dependency at all.
gui = ["assistants", "icons", "dep:eframe", "dep:egui", "dep:image", "dep:arboard", "dep:rfd"]
# The parts that let AI apps use the notes: the MCP server, the setup of AI apps' settings and the
# memory skill. A build that does not want them (the server, the phone app's core) leaves them out.
assistants = []
# The table of icon names and their glyphs, for builds with no window that still draw note icons.
icons = []

[dependencies]
eframe = { version = "0.31", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "0.31", optional = true }
# Decodes the pictures a note embeds. Only the formats a note realistically points at: PNG,
# JPEG and GIF.
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
    "jpeg",
    "gif",
] }
# The system's own "choose a file" dialog for the toolbar's picture button.
rfd = { version = "0.15", optional = true, default-features = false, features = [
    "xdg-portal",
    "async-std",
] }
# Reads a picture copied to the clipboard, so a screenshot can be pasted into a note. The
# Wayland feature lets a Wayland session offer its clipboard directly; elsewhere arboard falls
# back to the X11 one on its own.
arboard = { version = "3", optional = true, features = ["wayland-data-control"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps the order of a person's own settings when another app's config file is
# rewritten to add the MCP server.
serde_json = { version = "1.0", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
yrs = "0.28"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
rcgen = "0.14"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
crossbeam-channel = "0.5"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
flate2 = "1"
tar = "0.4"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
# Whole-program optimisation across the crates the app is built from: a smaller, somewhat
# faster binary, for a slower release build.
lto = "thin"
codegen-units = 1
