# Flatpak manifest for the prebuilt release binary.
#
# The binary is built by the release workflow (inside an Ubuntu 22.04 container for a wide
# glibc range) and this manifest only installs it, so no Rust toolchain is pulled into the
# sandbox. `flatpak-builder` is run from the repository root after
# `scripts/build-flatpak.sh` has staged the binary and icons next to this file.
app-id: io.github.noxilith.EloraNotes
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: elora
finish-args:
  # Wayland first, X11 as a fallback for older desktops.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # The app checks GitHub for new releases and the update notice should work here too.
  - --share=network
  # Notes live in the user's own documents by default, so the sandbox has to show the real
  # folder. `xdg-documents` is empty on systems without an XDG user-dirs file (a plain NixOS
  # install, for one), which would leave the app staring at a throwaway home directory, so the
  # folder the app actually defaults to is granted by name as well.
  - --filesystem=xdg-documents
  - --filesystem=~/Documents
  - --filesystem=xdg-download
  # matugen (and anything else following the README) writes the wallpaper colors to
  # ~/.config/elora/matugen.json, which the sandbox would otherwise hide.
  - --filesystem=xdg-config/elora:ro
  # The launcher runs the app from a writable copy here so in-app updates are possible at all;
  # /app itself stays read-only.
  - --filesystem=xdg-data/EloraNotes:create
modules:
  - name: eloranotes
    buildsystem: simple
    build-commands:
      - install -Dm755 elora /app/lib/eloranotes/elora
      # The launcher compares this with the copy it last installed, so a newer bundle replaces
      # the copy the sandbox starts instead of being ignored.
      - install -Dm644 version /app/lib/eloranotes/version
      - install -Dm755 elora-launcher /app/bin/elora
      - install -Dm644 io.github.noxilith.EloraNotes.desktop
        /app/share/applications/io.github.noxilith.EloraNotes.desktop
      - install -Dm644 elora-notes.metainfo.xml
        /app/share/metainfo/io.github.noxilith.EloraNotes.metainfo.xml
      - install -Dm644 io.github.noxilith.EloraNotes-256.png
        /app/share/icons/hicolor/256x256/apps/io.github.noxilith.EloraNotes.png
      - install -Dm644 io.github.noxilith.EloraNotes-512.png
        /app/share/icons/hicolor/512x512/apps/io.github.noxilith.EloraNotes.png
    sources:
      - type: file
        path: elora
      - type: file
        path: version
      - type: file
        path: elora-launcher
      - type: file
        path: io.github.noxilith.EloraNotes.desktop
      - type: file
        path: elora-notes.metainfo.xml
      - type: file
        path: io.github.noxilith.EloraNotes-256.png
      - type: file
        path: io.github.noxilith.EloraNotes-512.png
